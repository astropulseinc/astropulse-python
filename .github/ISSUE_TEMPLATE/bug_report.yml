name: Bug report
description: Something in the SDK does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code to reproduce
      description: The smallest snippet that shows the problem. Remove API keys and other secrets.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      description: Output of `python -c "import astropulse; print(astropulse.__version__)"`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
    validations:
      required: true
