name: Feature request
description: Something the SDK should make easier.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: If the API itself lacks something, say so; the SDK only covers what the API offers.
