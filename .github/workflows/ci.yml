name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims to support (pyproject classifiers).
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # `make check` is what a contributor runs, so CI cannot drift from it.
      - run: make check

  generated:
    # The committed client must be exactly what the document produces: a
    # hand-edit under _generated/, a stale regeneration, or a model the document
    # added and nobody regenerated for, all fail here. `git add -A` first,
    # because a diff alone does not see a file that regeneration created.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: make generate
      - name: The generated code matches spec/openapi.yaml
        run: |
          git add -A
          git diff --cached --exit-code
