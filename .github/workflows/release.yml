name: Release

# Publishing is tag-driven: a v1.2.3 tag on main publishes 1.2.3 to PyPI. The tag
# workflow creates the tag when a version change merges; nobody tags by hand.
# PyPI authenticates through Trusted Publishing (OIDC), so no PyPI token is
# stored here, and the upload carries PyPI attestations of where it was built.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # All history and tags: the checks below compare with main and with
          # every earlier release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # A tag can be pushed at any commit, and a release cannot be taken back.
      - name: The tag names this version, on main, newer than every release
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }
          mapfile -t tags < <(git tag --list 'v*')
          python3 scripts/release_version.py tag "${GITHUB_REF_NAME}" "${tags[@]}"

      - name: The tests, style and types, before anything is published
        run: make check

      - run: make build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Restricted to v* tags in the repository settings; PyPI trusts only this
    # workflow in this environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      # Pinned to a commit: this job can mint a PyPI token through OIDC.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install with \`pip install astropulse==${GITHUB_REF_NAME#v}\`. Changes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            --generate-notes
